<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist de Entrada - Vistoria Técnica Inicial</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/industrial_slate.css">
</head>
<body>

<div class="workflow-container">

    <!-- Header do Checklist de Entrada -->
    <header class="workflow-header">
        <div class="workflow-header-top">
            <div class="workflow-brand">
                <div class="workflow-brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div class="workflow-brand-text">
                    <h1>Checklist de Entrada</h1>
                    <p>Vistoria Técnica Inicial &bull; Triagem de Avarias</p>
                </div>
            </div>
            <a href="index.html" class="btn-icon-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Painel
            </a>
        </div>
    </header>

    <!-- Card 1: Identificação da Máquina e Chamado -->
    <div class="inner-card">
        <div class="inner-card-header">
            <span class="inner-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Identificação do Equipamento &bull; O.S. <span class="bind-os-id">#1002</span>
            </span>
            <span class="status-badge concluido" id="badgeCheckinStatus">CONCLUÍDO</span>
        </div>
        <div class="form-group">
            <label>Cliente / Fazenda</label>
            <input type="text" class="form-control" value="Fazenda Santa Cecília Agronegócios" readonly>
        </div>
        <div class="form-group">
            <label>Equipamento / Modelo</label>
            <input type="text" class="form-control" value="Case IH 8250" readonly>
        </div>
        <div class="form-row-compact-2">
            <div class="form-group">
                <label>Frota</label>
                <input type="text" class="form-control" value="Frota 204" readonly>
            </div>
            <div class="form-group">
                <label>Horímetro</label>
                <input type="text" class="form-control" value="1.850 h" readonly>
            </div>
        </div>
        <div class="form-group">
            <label>Solicitante</label>
            <input type="text" class="form-control" value="Eduardo Silveira (Encarregado)" readonly>
        </div>
        <div class="form-group">
            <label>Reclamação do Cliente / Diagnóstico Inicial</label>
            <textarea class="form-control" rows="2" readonly>Ruído anormal no mancal axial do rotor de trilha com superaquecimento constatado. Recolhido para desmontagem e vistoria de entrada na oficina mecânica.</textarea>
        </div>
    </div>

    <!-- Barra de Ações Rápidas de Modelos e Itens -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px;">
        <label class="btn-icon-link" style="cursor: pointer; justify-content: center; height: 38px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Importar Modelo (.pdf, .xlsx)
            <input type="file" accept=".pdf,.xlsx,.xls,.docx,.doc" style="display:none;" onchange="alert('Modelo externo importado com sucesso!')">
        </label>
        <button type="button" class="btn-icon-link" style="justify-content: center; height: 38px;" onclick="document.getElementById('modalNovoItemCheckin').classList.add('active')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            + Adicionar Item Manual
        </button>
    </div>

    <!-- Lista de Itens do Checklist de Entrada -->
    <div id="checkinItensList" style="display: flex; flex-direction: column; gap: 10px;"></div>

    <!-- Assinatura Touch da Vistoria Inicial -->
    <div class="inner-card" style="margin-top: 12px;">
        <div class="inner-card-header">
            <span class="inner-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
                Assinatura Digital do Recebimento (Touch)
            </span>
            <button type="button" class="btn-clear-sig" onclick="workflow.limparAssinatura('canvasAssinaturaCheckin')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Limpar
            </button>
        </div>
        <div class="signature-canvas-wrapper">
            <canvas id="canvasAssinaturaCheckin"></canvas>
        </div>
        <div class="signature-footer">
            <span class="signature-caption">Assine acima com o dedo ou caneta touch</span>
        </div>
    </div>

    <!-- Ações de Exportação -->
    <div class="export-grid-actions">
        <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('pdf', 'Check-In')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            PDF
        </button>
        <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('excel', 'Check-In')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
            Excel
        </button>
        <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('word', 'Check-In')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><line x1="8" y1="9" x2="16" y2="9"></line><line x1="8" y1="13" x2="16" y2="13"></line></svg>
            Word
        </button>
        <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('imprimir', 'Check-In')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Imprimir
        </button>
        <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('whatsapp', 'Check-In')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            WhatsApp
        </button>
    </div>

    <!-- Botão Primário: Salvar Checklist de Entrada -->
    <button type="button" class="btn-stack btn-salvar-os" onclick="workflow.salvarCheckin();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Salvar Checklist de Entrada
    </button>

</div>

<!-- MODAL: MICRO-EDITOR CANVAS PARA FOTOS (MARCAÇÃO VERMELHA & NOTAS) -->
<div class="canvas-editor-overlay" id="canvasEditorModal">
    <div class="canvas-editor-dialog">
        <div class="canvas-editor-header">
            <h3>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                Micro-Editor de Foto &bull; Marcação de Avaria
            </h3>
            <button type="button" class="btn-tool" onclick="workflow.fecharMicroEditor()" aria-label="Fechar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="canvas-stage">
            <canvas id="canvasEditorStage"></canvas>
        </div>
        <div class="canvas-editor-tools">
            <button type="button" class="btn-tool active">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path></svg>
                Pincel Vermelho
            </button>
            <button type="button" class="btn-tool" onclick="const t = prompt('Digite a nota técnica para estampar na foto:'); if(t) workflow.adicionarAnotacaoTextoCanvas(t);">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                Digitar Nota
            </button>
            <button type="button" class="btn-tool" style="margin-left: auto; background: var(--success); color: #fff; border-color: #10b981;" onclick="workflow.salvarMicroEditorFoto()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                Salvar Anotação
            </button>
        </div>
    </div>
</div>

<!-- MODAL: ADICIONAR ITEM MANUAL AO CHECKLIST DE ENTRADA -->
<div class="canvas-editor-overlay" id="modalNovoItemCheckin">
    <div class="canvas-editor-dialog" style="max-width: 380px;">
        <div class="canvas-editor-header">
            <h3>+ Adicionar Item de Vistoria</h3>
            <button type="button" class="btn-tool" onclick="document.getElementById('modalNovoItemCheckin').classList.remove('active')" aria-label="Fechar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
            <div class="form-group">
                <label>Nome do Item</label>
                <input type="text" id="novoItemNome" class="form-control" placeholder="Ex: Cilindro de Direção">
            </div>
            <div class="form-group">
                <label>Categoria / Sistema</label>
                <select id="novoItemCategoria" class="form-control">
                    <option value="Transmissão / Colheita">Transmissão / Colheita</option>
                    <option value="Hidráulico">Hidráulico</option>
                    <option value="Motor Diesel">Motor Diesel</option>
                    <option value="Elétrico">Elétrico</option>
                    <option value="Estrutural / Cabine">Estrutural / Cabine</option>
                    <option value="Rodados / Pneus">Rodados / Pneus</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status Inicial</label>
                <select id="novoItemStatus" class="form-control">
                    <option value="conforme">Conforme (OK)</option>
                    <option value="avaria">Com Avaria (Defeito)</option>
                    <option value="na">Não Aplicável (N/A)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Observação Inicial</label>
                <input type="text" id="novoItemObs" class="form-control" placeholder="Anotações do técnico...">
            </div>
            <button type="button" class="btn-stack btn-salvar-os" style="height: 42px; margin-top: 6px;" onclick="workflow.adicionarItemCheckinManual(document.getElementById('novoItemNome').value, document.getElementById('novoItemCategoria').value, document.getElementById('novoItemStatus').value, document.getElementById('novoItemObs').value); document.getElementById('modalNovoItemCheckin').classList.remove('active'); document.getElementById('novoItemNome').value='';">
                Adicionar Item à Lista
            </button>
        </div>
    </div>
</div>

<script src="js/workflow_controller.js"></script>
</body>
</html>
