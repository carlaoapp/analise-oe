<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orçamento Interno - Fechamento Comercial &amp; Faturamento</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/industrial_slate.css">
</head>
<body>

<div class="workflow-container">

    <!-- Header do Orçamento Interno -->
    <header class="workflow-header">
        <div class="workflow-header-top">
            <div class="workflow-brand">
                <div class="workflow-brand-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
                <div class="workflow-brand-text">
                    <h1>Orçamento Interno</h1>
                    <p>Fechamento Comercial &bull; O.S. <span class="bind-os-id">#1002</span></p>
                </div>
            </div>
            <div style="display: flex; gap: 6px;">
                <a href="index.html" class="btn-icon-link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Painel
                </a>
            </div>
        </div>
    </header>

    <!-- Dados da O.S. Interna de Origem -->
    <div class="inner-card">
        <div class="inner-card-header">
            <span class="inner-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Origem &bull; O.S. Interna Oficina
            </span>
            <span class="status-badge andamento">AGUARDANDO FATURAMENTO</span>
        </div>
        <div class="form-group">
            <label>Cliente</label>
            <input type="text" class="form-control bind-cliente" value="Fazenda Santa Cecília Agronegócios" readonly>
        </div>
        <div class="form-group">
            <label>Máquina / Frota</label>
            <input type="text" class="form-control" value="Case IH 8250 (Frota 204)" readonly>
        </div>
    </div>

    <!-- Leitura Dinâmica em Tempo Real da Oficina -->
    <div class="financial-summary-grid">
        <div class="summary-item">
            <span class="summary-label">Peças Requisitadas</span>
            <span class="summary-value" id="orcPecasTotal">R$ 0,00</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Mão de Obra Oficina</span>
            <span class="summary-value" id="orcServicosTotal">R$ 0,00</span>
        </div>
    </div>

    <div class="inner-card" style="background: rgba(37, 99, 235, 0.08); border-color: rgba(56, 189, 248, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-size: 0.72rem; color: var(--txt-secondary); text-transform: uppercase;">Total Global</div>
                <div style="font-size: 1.4rem; font-weight: 800; color: #34d399;" id="orcTotalGeral">R$ 0,00</div>
            </div>
            <div style="font-size: 0.75rem; color: var(--txt-muted); text-align: right;">
                Atualizado dinamicamente<br>da O.S. Interna
            </div>
        </div>
    </div>

    <!-- Detalhamento de Itens Agrupados -->
    <div class="inner-card">
        <div class="inner-card-header">
            <span class="inner-card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                Composição do Orçamento
            </span>
        </div>
        <div class="table-responsive">
            <table class="slate-table">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Descrição</th>
                        <th style="text-align:center;">Qtd/H</th>
                        <th style="text-align:right;">Subtotal</th>
                    </tr>
                </thead>
                <tbody id="tabelaOrcamentoCorpo"></tbody>
            </table>
        </div>
    </div>

    <!-- Barra de Modelos (.xlsx, .docx, .pdf) -->
    <div class="inner-card">
        <div class="form-group">
            <label>Modelo de Apresentação e Proposta</label>
            <select class="form-control" id="selectModeloOrcamento">
                <option value="padrao">[ Modelo Padrão do Sistema ]</option>
                <option value="terra_viva">Terra Viva Agromecânica (Modelo PDF)</option>
                <option value="sultratores">Sultratores Manutenção &amp; Peças (Modelo Planilha Excel)</option>
                <option value="alvorada">Alvorada Soluções Mecânicas (Modelo Word / Proposta)</option>
            </select>
        </div>

        <!-- Checkbox Mestre e Seleção em Lote -->
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px;">
            <label class="triage-checkbox-label" style="color: var(--txt-primary);">
                <input type="checkbox" checked id="chkSelecionarTodosOrc">
                <span>Selecionar Todos os Itens para Faturamento</span>
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button type="button" class="btn-tool" style="padding: 8px; justify-content: center; font-weight: 600;" onclick="alert('Modo de edição de valores ativado.');">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    Editar Valores
                </button>
                <button type="button" class="btn-tool" style="padding: 8px; justify-content: center; font-weight: 600;" onclick="if(confirm('Cancelar orçamento?')) alert('Orçamento cancelado.');">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    Cancelar
                </button>
            </div>
        </div>

        <!-- Botões Compactos de Exportação -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px;">
            <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('pdf', 'Orçamento')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                PDF
            </button>
            <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('excel', 'Orçamento')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                Excel
            </button>
            <button type="button" class="btn-export-compact" onclick="workflow.exportarDocumento('imprimir', 'Orçamento')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Imprimir
            </button>
        </div>

        <!-- Botão Primário Largo: Faturar O.S. Interna -->
        <button type="button" class="btn-stack btn-salvar-os" style="margin-top: 12px;" onclick="workflow.state.orcamento.statusFinanceiro = 'faturada'; workflow.salvarEstado(); workflow.renderizarTudo(); alert('Orçamento aprovado e Faturado com sucesso!');">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            Faturar O.S. Interna / Aguardando Pagamento
        </button>
    </div>

</div>

<script src="js/workflow_controller.js"></script>
</body>
</html>
